<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Special Surprise 💖</title>

<style>

body{
    margin:0;
    padding:0;
    font-family: 'Comic Sans MS', cursive;
    background: linear-gradient(135deg,#ff6f91,#ff9671,#ffc75f,#f9f871);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    color:black;
    text-align:center;
    overflow-x:hidden;
}

.screen{
    display:none;
    width:90%;
    max-width:700px;
    margin-top:40px;
}

.screen.active{
    display:block;
}

button{
    padding:15px 30px;
    font-size:18px;
    border:none;
    border-radius:30px;
    background:#ff4f81;
    color:white;
    cursor:pointer;
    margin-top:20px;
}

button:hover{
    transform:scale(1.05);
}

#msgArea{
    white-space:pre-wrap;
    line-height:1.9em;
    font-size:18px;
    margin-top:20px;
}

.gallery{
    margin-top:20px;
}

.gallery img{
    width:300px;
    max-width:90%;
    border-radius:20px;
    box-shadow:0 0 15px rgba(0,0,0,0.5);
}

.confetti{
    position:absolute;
    top:-30px;
    font-size:24px;
    animation:fall linear forwards;
    pointer-events:none;
}

@keyframes fall{
    to{
        transform:translateY(500px) rotate(360deg);
        opacity:0;
    }
}

</style>
</head>

<body>

<!-- SCREEN 1 -->

<div id="screen1" class="screen active">

    <h1>Hey You 😉💖</h1>

    <button onclick="startScreen2()">
        Click Me If You Dare 😏
    </button>

</div>

<!-- SCREEN 2 -->

<div id="screen2" class="screen">

    <h2 id="funnyTextArea"></h2>

    <button id="nextBtn"
            style="display:none;"
            onclick="showMessageScreen()">

        Next 🥰

    </button>

</div>

<!-- SCREEN 3 -->

<div id="screen3" class="screen">

    <div id="msgArea"></div>

    <button id="surpriseBtn"
            style="display:none;"
            onclick="showImageScreen()">

        See Surprise 🎁

    </button>

</div>

<!-- SCREEN 4 -->

<div id="screen4" class="screen">

    <h2>Our Memories 💕</h2>

    <div class="gallery">

        <img src="phot2.jpg" alt="Memory">

    </div>

</div>

<!-- AUDIO -->

<audio id="song1" autoplay loop>
    <source src="song1.mp4" type="audio/mp4">
</audio>

<script>

let funnyText =
"Scanning Cuteness Level... 20% 🐣 ... 60% 🐥 ... 100% 😍 ALERT! Maximum Cuteness Detected!";

let funnyIndex = 0;

let message = `To my everything (biggest supporter , unpaid therapist, happiness,joy, encouragement and many more)

I wanted to write paragraphs, letters about you and fill all the colours of my life in the paper , but it's just a paper and it would get wrinkled and faded.
So sending this small edit to youhh

Pata nahi kaha se shuru Karu🥺

Didn't even think that my farewell which is saying goodbye to you will come this fastt

Time flew very fast that I feel like
"Kya jaldi bade hogaye hum" and
Really if someone ask about friendship you will always be my first name 🥹

So in 3rd year I will not be there sitting in the bench beside you😣🫂
Laughing the fullest about small things, eating lunch, sharing gossips,
Washroom walks , telling each everything about future and life, I will really miss all this funn😣😣🥺🫂

Even in dreams didn't imagine that we wouldn't be together till 4 years and my journey in vignan was for 2 years

But U are my stronggest gudiya💎🫂♥️
Kabhi bhi khud ko akela mat samajhna
I will always be there with my water bottle 🙂 , hassi ayina
Aise hi haste rehna ,enjoy karna

U will always be my forever and ever best friend
U always brought my extrovert side
I survived very happily, poora clg ghooma ,mast memories banaye🫠

So A big biggest THANK YOU✨😘🫂 for everything.

Bohot kuch likhna chahti hu
But it will end up looking like assignment 😄

Always remember,
U can win every battle, deserve everything in the world,
jattan rehna,and Inshallah you will go to abroad,job and everything 💝🤞

This is the last paragraph aur kuch nai hai,it is becoming an assignment 😄

Sun yaaaraa🥺
Tu apne logaku bhot khayal rakhti hai, but they always hurt you,
maine bhi hurt Kiya hai ,so sorry for everything 🥹

And u give all your kindness to everyone without any egoness
People who have have you in their life are the most luckiest.

Apna khayal rakhna💌
roj khaana khana,
be healthy and achieve everything u wanted to 😊

jab 3rd year start hoga bilkul darna mat ,
tu bohot brave hai and all the best for everything.

I hope u will like those gifts

Zyada rona mat🫂🫂
jab tak mere pass phone hai mai msg karti rahungi beech beech me

Holidays accha enjoy karna ,
apna khayal rakhna

THANK YOU FOR EVERYTHING 🥹🥹💝🫂

WILL MISSSSS YOUUUUUUUUUUU MORE THAN WORDS 🫠🫠😊🥰`;


// SCREEN 1 TO SCREEN 2

function startScreen2(){

    document.getElementById("screen1").classList.remove("active");

    document.getElementById("screen2").classList.add("active");

    typeFunny();

    document.getElementById("song1").play();
}


// FUNNY TEXT TYPING

function typeFunny(){

    if(funnyIndex < funnyText.length){

        document.getElementById("funnyTextArea").innerHTML += funnyText.charAt(funnyIndex);

        funnyIndex++;

        setTimeout(typeFunny,50);

    }else{

        document.getElementById("nextBtn").style.display = "inline-block";
    }
}


// SHOW MESSAGE SCREEN

function showMessageScreen(){

    document.getElementById("screen2").classList.remove("active");

    document.getElementById("screen3").classList.add("active");

    typeMessage();
}


// TYPE MESSAGE

let msgIndex = 0;

function typeMessage(){

    if(msgIndex < message.length){

        document.getElementById("msgArea").innerHTML += message.charAt(msgIndex);

        msgIndex++;

        setTimeout(typeMessage,20);

    }else{

        document.getElementById("surpriseBtn").style.display = "inline-block";
    }
}


// SHOW IMAGE SCREEN

function showImageScreen(){

    document.getElementById("screen3").classList.remove("active");

    document.getElementById("screen4").classList.add("active");

}


// CONFETTI

setInterval(()=>{

    const emojis = ["💖","✨","🌸","🥰","💫","🎉"];

    let conf = document.createElement("div");

    conf.classList.add("confetti");

    conf.innerText = emojis[Math.floor(Math.random()*emojis.length)];

    conf.style.left = Math.random()*100 + "%";

    conf.style.animationDuration = (Math.random()*3+2) + "s";

    document.body.appendChild(conf);

    setTimeout(()=>{
        conf.remove();
    },4000);

},300);

</script>

</body>
</html>
